<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – IntelliStay</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Design System -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-ivory" style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-intellistay">
    <div class="container">
      <a class="brand-logo" href="/index.html">
        <i class="bi bi-compass text-olive"></i>
        <span>Intelli</span>Stay
      </a>
      <a href="/index.html" class="btn btn-outline-forest btn-sm px-3 rounded-pill">
        <i class="bi bi-arrow-left me-1"></i> Return Home
      </a>
    </div>
  </nav>

  <!-- Login Card Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        
        <div class="p-4 p-md-5 bg-white rounded-4 border shadow-sm" style="border-color: var(--border-subtle) !important;">
          <div class="text-center mb-4">
            <div class="bg-gold-tint p-3 rounded-circle text-olive d-inline-flex mb-2">
              <i class="bi bi-person-check fs-2"></i>
            </div>
            <h3 class="font-serif text-forest mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to your IntelliStay account</p>
          </div>

          <form id="login-form">
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted text-uppercase">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="login-email" class="form-control" required placeholder="name@domain.com">
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-bold text-muted text-uppercase mb-0">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
              </div>
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-forest w-100 py-2 fw-semibold mb-3">
              Sign In to Account
            </button>
          </form>

          <div class="text-center small text-muted mb-4">
            Don't have an account yet? <a href="/register.html" class="fw-bold text-olive">Register Here</a>
          </div>

          <!-- 1-Click Demo Logins for Evaluator -->
          <div class="p-3 bg-cream rounded-3 border" style="border-color: var(--border-light) !important;">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="small fw-bold text-forest text-uppercase" style="font-size: 0.72rem;">
                <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick 1-Click Demo Logins
              </span>
              <span class="badge bg-forest" style="font-size: 0.65rem;">Academic Evaluation</span>
            </div>
            <div class="d-grid gap-1">
              <button type="button" class="btn btn-sm btn-outline-forest text-start py-1 px-2" onclick="fillAndLogin('customer@intellistay.com', 'password123')">
                <i class="bi bi-person me-1"></i> <strong>Customer</strong> (Rohan Verma)
              </button>
              <button type="button" class="btn btn-sm btn-outline-forest text-start py-1 px-2" onclick="fillAndLogin('owner@intellistay.com', 'password123')">
                <i class="bi bi-building me-1"></i> <strong>Hotel Owner</strong> (Kabir Oberoi)
              </button>
              <button type="button" class="btn btn-sm btn-outline-forest text-start py-1 px-2" onclick="fillAndLogin('receptionist@intellistay.com', 'password123')">
                <i class="bi bi-bell me-1"></i> <strong>Receptionist</strong> (Front Desk)
              </button>
              <button type="button" class="btn btn-sm btn-outline-forest text-start py-1 px-2" onclick="fillAndLogin('housekeeping@intellistay.com', 'password123')">
                <i class="bi bi-brush me-1"></i> <strong>Housekeeping Staff</strong> (Deepa Kumari)
              </button>
              <button type="button" class="btn btn-sm btn-outline-forest text-start py-1 px-2" onclick="fillAndLogin('maintenance@intellistay.com', 'password123')">
                <i class="bi bi-wrench me-1"></i> <strong>Maintenance Staff</strong> (Mahesh Patil)
              </button>
              <button type="button" class="btn btn-sm btn-outline-forest text-start py-1 px-2" onclick="fillAndLogin('admin@intellistay.com', 'admin123')">
                <i class="bi bi-shield-lock me-1"></i> <strong>Super Admin</strong> (System Administrator)
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-3 text-center text-muted small mt-auto border-top">
    &copy; 2026 IntelliStay Hospitality Systems Inc.
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App JS -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      await executeLogin(email, password);
    });

    async function fillAndLogin(email, password) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = password;
      await executeLogin(email, password);
    }

    async function executeLogin(email, password) {
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing In...';

      try {
        const res = await api.post('/auth/login', { email, password });
        if (res.success && res.token && res.user) {
          api.setToken(res.token);
          api.setUser(res.user);
          api.showToast(`Welcome back, ${res.user.full_name}!`, 'success');

          setTimeout(() => {
            redirectUserByRole(res.user.role);
          }, 600);
        }
      } catch (err) {
        api.showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Sign In to Account';
      }
    }
  </script>
</body>
</html>
